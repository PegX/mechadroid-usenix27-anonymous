[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-llm-gnn-blueprint"
version = "0.1.0"
description = "Research codebase for Android malware detection with LLM+GNN and MeVGT-style attacks."
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
